<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,400&family=Playfair+Display:wght@700;900&display=swap" rel="stylesheet">
    <title>Amigo Secreto</title>
</head>

<body>
    <main class="main-content">
        <header class="hero">
            <div class="hero__bg-shapes">
                <span class="shape shape--1"></span>
                <span class="shape shape--2"></span>
                <span class="shape shape--3"></span>
            </div>
            <div class="hero__content">
                <img src="assets/amigo-secreto.png" alt="Amigo Secreto" class="hero__image">
                <h1 class="hero__title">Amigo Secreto</h1>
            </div>
        </header>

        <section class="app-section" aria-label="Aplicativo de amigo secreto">
            <div class="app-card">

                <div class="input-area">
                    <div class="input-group">
                        <label for="amigo" class="sr-only">Nome do participante</label>
                        <div class="input-wrapper">
                            <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                <circle cx="12" cy="7" r="4"></circle>
                            </svg>
                            <input type="text" id="amigo" class="input-field" placeholder="Digite o nome de um amigo" autocomplete="off" maxlength="40">
                        </div>
                        <button id="btnAdicionar" class="btn btn--primary" aria-label="Adicionar participante">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" aria-hidden="true" width="20" height="20">
                                <line x1="12" y1="5" x2="12" y2="19"></line>
                                <line x1="5" y1="12" x2="19" y2="12"></line>
                            </svg>
                            <span>Adicionar</span>
                        </button>
                    </div>
                    <p class="input-hint">Pressione <kbd>Enter</kbd> para adicionar rapidamente</p>
                </div>

                <div class="participants">
                    <div class="participants__header">
                        <h2 class="participants__title">
                            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" width="20" height="20">
                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                                <circle cx="9" cy="7" r="4"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                            </svg>
                            Participantes
                        </h2>
                        <span id="counter" class="participants__counter" aria-live="polite">0</span>
                    </div>

                    <div id="emptyState" class="empty-state">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true" width="48" height="48">
                            <circle cx="12" cy="12" r="10"></circle>
                            <path d="M16 16s-1.5-2-4-2-4 2-4 2"></path>
                            <line x1="9" y1="9" x2="9.01" y2="9"></line>
                            <line x1="15" y1="9" x2="15.01" y2="9"></line>
                        </svg>
                        <p>Nenhum participante ainda</p>
                        <span>Digite um nome acima para começar</span>
                    </div>

                    <ul id="listaAmigos" class="participant-list" aria-label="Lista de participantes" hidden></ul>
                </div>

                <div id="resultadoContainer" class="result-area" hidden>
                    <h2 class="result-area__title">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" width="22" height="22">
                            <polyline points="20 12 20 22 4 22 4 12"></polyline>
                            <rect x="2" y="7" width="20" height="5"></rect>
                            <line x1="12" y1="22" x2="12" y2="7"></line>
                            <path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"></path>
                            <path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"></path>
                        </svg>
                        Resultado do Sorteio
                    </h2>
                    <ul id="resultado" class="result-list" aria-label="Pares sorteados"></ul>
                </div>

                <div class="actions">
                    <button id="btnSortear" class="btn btn--draw" aria-label="Sortear amigo secreto">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" width="20" height="20">
                            <polygon points="5 3 19 12 5 21 5 3"></polygon>
                        </svg>
                        <span>Sortear amigo</span>
                    </button>
                    <button id="btnLimpar" class="btn btn--ghost" aria-label="Limpar lista de participantes">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true" width="18" height="18">
                            <polyline points="3 6 5 6 21 6"></polyline>
                            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
                        </svg>
                        <span>Limpar</span>
                    </button>
                </div>

            </div>
        </section>

        <footer class="footer">
            <p>Feito com carinho para seus sorteios</p>
        </footer>
    </main>

    <div id="modalOverlay" class="modal-overlay" role="dialog" aria-modal="true" aria-hidden="true">
        <div class="modal">
            <div id="modalIcon" class="modal__icon"></div>
            <h3 id="modalTitle" class="modal__title"></h3>
            <p id="modalMessage" class="modal__message"></p>
            <div class="modal__actions">
                <button id="modalBtnCancel" class="modal__btn modal__btn--cancel" hidden>Cancelar</button>
                <button id="modalBtnConfirm" class="modal__btn modal__btn--confirm">OK</button>
            </div>
        </div>
    </div>

    <script src="app.js" defer></script>
</body>
</html>
